! router1.cfg — Arista EOS
! Part of the Batfish pipeline validation example
! Topology: router1 (192.168.1.1) -- 10.0.12.0/30 -- router2 (192.168.2.1)

hostname router1

! ── Interfaces ──────────────────────────────────────────────
interface Loopback0
   ip address 1.1.1.1/32

interface GigabitEthernet0/0
   description "P2P link to router2"
   ip address 10.0.12.1/30
   ip access-group BLOCK_TELNET in
   no shutdown

interface GigabitEthernet0/1
   description "LAN — host1 subnet"
   ip address 192.168.1.1/24
   no shutdown

! ── OSPF ────────────────────────────────────────────────────
router ospf 1
   router-id 1.1.1.1
   network 10.0.12.0/30 area 0
   network 192.168.1.0/24 area 0
   network 1.1.1.1/32 area 0

! ── ACL: block inbound Telnet on external interface ─────────
! Telnet is prohibited in production (REQ-SEC-04: no insecure protocols)
ip access-list BLOCK_TELNET
   10 deny tcp any any eq 23 log
   20 permit ip any any

! ── Management ──────────────────────────────────────────────
management api http-commands
   protocol https
   no shutdown

ip ssh version 2

! ── NTP / Syslog ────────────────────────────────────────────
ntp server 10.0.0.100
logging host 10.0.0.100
logging trap informational
