! router2.cfg — Arista EOS
! Part of the Batfish pipeline validation example

hostname router2

! ── Interfaces ──────────────────────────────────────────────
interface Loopback0
   ip address 2.2.2.2/32

interface GigabitEthernet0/0
   description "P2P link to router1"
   ip address 10.0.12.2/30
   ip access-group BLOCK_TELNET in
   no shutdown

interface GigabitEthernet0/1
   description "LAN — host2 subnet"
   ip address 192.168.2.1/24
   no shutdown

! ── OSPF ────────────────────────────────────────────────────
router ospf 1
   router-id 2.2.2.2
   network 10.0.12.0/30 area 0
   network 192.168.2.0/24 area 0
   network 2.2.2.2/32 area 0

! ── ACL: block inbound Telnet on external interface ─────────
ip access-list BLOCK_TELNET
   10 deny tcp any any eq 23 log
   20 permit ip any any

! ── Management ──────────────────────────────────────────────
management api http-commands
   protocol https
   no shutdown

ip ssh version 2

! ── NTP / Syslog ────────────────────────────────────────────
ntp server 10.0.0.100
logging host 10.0.0.100
logging trap informational
