# ACME Investments — Source of Truth
# Layer 3 of the three-layer intent model
# This file is the single source of edit for all device data.
# All intent references (intent: [...]) link this data to design_intents.yml.
# Configuration is generated from this file — never edited directly on devices.

# ── lon-dc1: Arista EOS Spine-Leaf ──────────────────────────────────────────

- hostname: spine01
  platform: arista_eos
  role: spine
  site: lon-dc1
  intent: [INTENT-TOPO-01, INTENT-RTG-01, INTENT-RTG-02]

  loopback:
    address: 10.0.254.1/32          # intent: INTENT-IP-01

  bgp:
    asn: 65001                       # intent: INTENT-RTG-01 (unique ASN per device)
    router_id: 10.0.254.1
    underlay_peers:
      - peer_ip: 10.0.1.1
        peer_asn: 65101
        description: "leaf01 underlay"
      - peer_ip: 10.0.1.5
        peer_asn: 65102
        description: "leaf02 underlay"
      - peer_ip: 10.0.1.9
        peer_asn: 65201
        description: "border-leaf01 underlay"
      - peer_ip: 10.0.1.13
        peer_asn: 65202
        description: "border-leaf02 underlay"
    evpn:
      enabled: true
      role: route_reflector           # intent: INTENT-RTG-02
      overlay_peers:
        - peer_ip: 10.0.254.11
          peer_asn: 65101
          description: "leaf01 EVPN"
        - peer_ip: 10.0.254.12
          peer_asn: 65102
          description: "leaf02 EVPN"
        - peer_ip: 10.0.254.21
          peer_asn: 65201
          description: "border-leaf01 EVPN"
        - peer_ip: 10.0.254.22
          peer_asn: 65202
          description: "border-leaf02 EVPN"

  interfaces:
    - name: Ethernet1
      description: "P2P to leaf01"
      ip: 10.0.1.0/31
    - name: Ethernet2
      description: "P2P to leaf02"
      ip: 10.0.1.4/31
    - name: Ethernet3
      description: "P2P to border-leaf01"
      ip: 10.0.1.8/31
    - name: Ethernet4
      description: "P2P to border-leaf02"
      ip: 10.0.1.12/31

  management:
    vrf: MGMT                         # intent: INTENT-MGMT-01
    address: 10.0.0.1/24
    ssh_vrf: MGMT
    syslog_servers:                   # intent: INTENT-MGMT-02
      - 10.0.0.100
      - 10.0.0.101
    snmp:
      version: v3
      auth: SHA
      priv: AES128

