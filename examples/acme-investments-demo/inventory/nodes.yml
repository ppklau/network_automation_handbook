          description: "spine02 EVPN RR"

  vxlan:
    source_interface: Loopback1
    loopback1_address: 10.0.253.21/32
    vlans:
      - vlan: 300
        vni: 10300
        name: DMZ
        vrf: DMZ
    vrfs:
      - name: DMZ
        l3vni: 50300

  svis:
    - vlan: 300
      name: DMZ_SVI
      vrf: DMZ
      ip: 10.0.30.1/24
      acl_in: ACL_DMZ_IN

  acls:
