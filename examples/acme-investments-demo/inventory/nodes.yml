          dst: any
          dst_port: [80, 443]
          comment: "REQ-SEC-03: DMZ outbound HTTP/HTTPS permitted"
        - seq: 20
          action: deny
          protocol: ip
          src: 10.0.30.0/24
          dst: 10.0.10.0/24
          comment: "REQ-SEC-01: DMZ cannot reach Trading zone"
        - seq: 30
          action: deny
          protocol: ip
          src: 10.0.30.0/24
          dst: 10.0.20.0/24
          comment: "REQ-SEC-01: DMZ cannot reach Corporate zone without firewall"
        - seq: 9999
          action: deny
          protocol: ip
          src: any
          dst: any
