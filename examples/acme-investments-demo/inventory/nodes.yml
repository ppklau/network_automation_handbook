# ── lon-branch1: Cisco IOS Branch ───────────────────────────────────────────

- hostname: lon-branch1-rtr01
  platform: cisco_ios
  role: wan_router
  site: lon-branch1
  intent: [INTENT-RTG-03, INTENT-SEG-01, INTENT-MGMT-01, INTENT-MGMT-02, INTENT-IP-01]

  loopback:
    address: 10.1.254.1/32          # intent: INTENT-IP-01

  ospf:
    process_id: 1
    router_id: 10.1.254.1
    area: 0                          # intent: INTENT-RTG-03
    default_route: inject
    authentication: md5

  interfaces:
    - name: GigabitEthernet0/0
      description: "WAN uplink primary"
      ip: dhcp
      zone: wan
    - name: GigabitEthernet0/1
      description: "WAN uplink secondary"
      ip: dhcp
      zone: wan
    - name: GigabitEthernet0/2
      description: "LAN to lon-branch1-sw01"
      ip: 10.1.0.1/24
      zone: corporate

  acls:                              # intent: INTENT-SEG-02
    - name: ACL_WAN_IN
      default_action: deny
      entries:
        - seq: 10
          action: deny
          protocol: ip
          src: 10.0.0.0/8
          dst: any
          comment: "REQ-SEC-03: block RFC1918 from WAN"
        - seq: 20
          action: permit
          protocol: tcp
          src: any
          dst: any
          dst_port: established
          comment: "REQ-NET-05: permit established return traffic"
        - seq: 9999
          action: deny
          protocol: ip
          src: any
          dst: any
          comment: "REQ-SEC-02: explicit deny-all"

  management:
    vrf: MGMT                        # intent: INTENT-MGMT-01
    address: 10.1.0.1/24
    ssh_source_interface: Loopback0
    ssh_vrf: MGMT
    syslog_servers:                  # intent: INTENT-MGMT-02
      - 10.0.0.100
      - 10.0.0.101
    snmp:
      version: v3
      auth: SHA
      priv: AES128

- hostname: lon-branch1-sw01
  platform: cisco_ios
  role: access_switch
  site: lon-branch1
  intent: [INTENT-SEG-01, INTENT-MGMT-01, INTENT-MGMT-02, INTENT-IP-01]

  loopback:
    address: 10.1.254.11/32

  ospf:
    process_id: 1
    router_id: 10.1.254.11
    area: 0
    passive_interfaces: [default]
    active_interfaces: [Vlan1]

  vlans:
    - id: 20
      name: CORPORATE
    - id: 99
      name: MGMT

  interfaces:
    - name: Vlan1
      description: "Uplink SVI to router"
      ip: 10.1.0.11/24
    - name: Vlan20
      description: "Corporate user VLAN"
      ip: 10.1.20.1/24
    - name: GigabitEthernet0/1
      description: "Uplink to lon-branch1-rtr01"
      mode: trunk
      allowed_vlans: [1, 20, 99]
    - name: GigabitEthernet0/2
      description: "Access port — corporate"
      mode: access
      vlan: 20
    - name: GigabitEthernet0/3
      description: "Access port — corporate"
      mode: access
      vlan: 20

  management:
    vrf: MGMT
    address: 10.1.0.11/24
    ssh_source_interface: Loopback0
    ssh_vrf: MGMT
    syslog_servers:
      - 10.0.0.100
      - 10.0.0.101
    snmp:
      version: v3
      auth: SHA
      priv: AES128
