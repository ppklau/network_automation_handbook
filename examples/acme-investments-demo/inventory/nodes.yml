- hostname: leaf01
  platform: arista_eos
  role: leaf
  site: lon-dc1
  intent: [INTENT-TOPO-01, INTENT-TOPO-02, INTENT-TOPO-03, INTENT-RTG-01, INTENT-SEG-01, INTENT-SEG-02]

  loopback:
    address: 10.0.254.11/32

  mlag:
    domain_id: LEAF_MLAG
    peer: leaf02
    peer_link: Port-Channel1
    peer_address: 10.0.254.12   # intent: INTENT-TOPO-02

  bgp:
    asn: 65101
    router_id: 10.0.254.11
    underlay_peers:
      - peer_ip: 10.0.1.1
        peer_asn: 65001
        description: "spine01 underlay"
      - peer_ip: 10.0.1.3
        peer_asn: 65002
        description: "spine02 underlay"
    evpn:
      enabled: true
      role: leaf
      overlay_peers:
        - peer_ip: 10.0.254.1
          peer_asn: 65001
          description: "spine01 EVPN RR"
        - peer_ip: 10.0.254.2
          peer_asn: 65002
          description: "spine02 EVPN RR"

  vxlan:                              # intent: INTENT-TOPO-03
    source_interface: Loopback1
    loopback1_address: 10.0.253.11/32
    vlans:
      - vlan: 100
        vni: 10100
        name: TRADING
        vrf: TRADING
      - vlan: 200
        vni: 10200
        name: CORPORATE
        vrf: CORPORATE
    vrfs:
      - name: TRADING
        l3vni: 50100
      - name: CORPORATE
        l3vni: 50200

  svis:                               # intent: INTENT-SEG-01
    - vlan: 100
      name: TRADING_SVI
      vrf: TRADING
      ip: 10.0.10.1/24
      acl_in: ACL_TRADING_IN
    - vlan: 200
      name: CORPORATE_SVI
      vrf: CORPORATE
      ip: 10.0.20.1/24
      acl_in: ACL_CORPORATE_IN

  acls:                               # intent: INTENT-SEG-02
    - name: ACL_TRADING_IN
      default_action: deny            # req: REQ-SEC-02
      entries:
        - seq: 10
          action: permit
          protocol: tcp
          src: 10.0.10.0/24
          dst: 10.0.10.0/24
          dst_port: any
          comment: "REQ-SEC-01: intra-trading east-west permitted"
        - seq: 20
          action: permit
          protocol: tcp
          src: 10.0.10.0/24
          dst: any
          dst_port: 443
          comment: "REQ-BIZ-01: market data HTTPS feeds"
        - seq: 9999
          action: deny
          protocol: ip
          src: any
          dst: any
          comment: "REQ-SEC-02: explicit deny-all"
    - name: ACL_CORPORATE_IN
      default_action: deny
      entries:
        - seq: 10
          action: permit
          protocol: tcp
          src: 10.0.20.0/24
          dst: 10.0.20.0/24
          dst_port: any
          comment: "REQ-SEC-01: intra-corporate east-west permitted"
        - seq: 20
          action: permit
          protocol: tcp
          src: 10.0.20.0/24
          dst: any
          dst_port: [80, 443]
          comment: "REQ-OPS-01: corporate internet access via proxy"
        - seq: 9999
          action: deny
          protocol: ip
          src: any
          dst: any
          comment: "REQ-SEC-02: explicit deny-all"

  management:
    vrf: MGMT
    address: 10.0.0.11/24
    ssh_vrf: MGMT
    syslog_servers:
      - 10.0.0.100
      - 10.0.0.101
    snmp:
      version: v3
      auth: SHA
      priv: AES128

